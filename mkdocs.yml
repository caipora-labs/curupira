site_name: OpsCli
site_url: https://mariotaddeucci.github.io/opscli/
site_description: Run GitHub and cron automations with local coding-agent CLIs.
repo_url: https://github.com/mariotaddeucci/opscli
docs_dir: docs
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: pt
          name: Português
          nav:
            - Início: index.md
            - Instalação: installation.md
            - Configuração: configuration.md
            - Operação: operations.md
            - Providers e agentes: providers.md
        - locale: es
          name: Español
          nav:
            - Inicio: index.md
            - Instalación: installation.md
            - Configuración: configuration.md
            - Operaciones: operations.md
            - Proveedores y agentes: providers.md
  - macros:
      module_name: main
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - griffe_pydantic:
                  schema: true
            docstring_style: google
            inherited_members: true
            members_order: source
            show_if_no_docstring: true
            show_root_heading: true
            show_source: false
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - language.select
nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Providers and agents: providers.md
