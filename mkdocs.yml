site_name: Curupira
site_url: https://caipora-labs.github.io/curupira/
site_description: Run GitHub and cron automations with local coding-agent CLIs.
repo_name: caipora-labs/curupira
repo_url: https://github.com/caipora-labs/curupira
edit_uri: edit/main/docs/
docs_dir: docs
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
        - locale: pt
          name: Português
          nav:
            - Início: index.md
            - Instalação: installation.md
            - Configuração: configuration.md
            - Operação: operations.md
            - Providers e agentes: providers.md
            - Plugins: plugins.md
        - locale: es
          name: Español
          nav:
            - Inicio: index.md
            - Instalación: installation.md
            - Configuración: configuration.md
            - Operaciones: operations.md
            - Proveedores y agentes: providers.md
            - Plugins: plugins.md
  - macros:
      module_name: main
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            extensions:
              - griffe_pydantic:
                  schema: true
            docstring_style: google
            inherited_members: true
            members_order: source
            show_if_no_docstring: true
            show_root_heading: true
            show_source: false
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy
    - language.select
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Operations: operations.md
  - Providers and agents:
      - Overview: providers.md
      - Claude Code: providers/claude.md
      - Codex: providers/codex.md
      - Cursor: providers/cursor.md
      - Gemini CLI: providers/gemini.md
      - GitHub Copilot CLI: providers/copilot.md
      - OpenCode: providers/opencode.md
      - pi: providers/pi.md
  - Plugins: plugins.md
