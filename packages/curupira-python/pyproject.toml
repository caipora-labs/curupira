[project]
name = "curupira"
dynamic = ["version"]
description = "Dispatch GitHub and cron tasks to local AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mario Taddeucci" }]
keywords = ["github", "automation", "coding-agents", "cli", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
# The CLI is the Rust binary from curupira-core (maturin). Official triggers ship as
# one optional package (curupira-plugins → curupira-sdk); install via extras or
# `curupira plugins install`.
dependencies = []

[project.optional-dependencies]
# Per-forge extras all install the consolidated package (one process, all triggers).
github = ["curupira-plugins>=0.1.0.dev0"]
extensions = ["curupira-plugins>=0.1.0.dev0"]

[project.urls]
Homepage = "https://github.com/caipora-labs/curupira"
Repository = "https://github.com/caipora-labs/curupira"
Issues = "https://github.com/caipora-labs/curupira/issues"
Changelog = "https://github.com/caipora-labs/curupira/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.uv.sources]
curupira-plugins = { workspace = true }

[tool.maturin]
manifest-path = "../curupira-core/Cargo.toml"
bindings = "bin"
python-source = "src"
