[project]
name = "curupira-trello"
version = "0.2.0"
description = "Official Curupira trello trigger extension (JSON-RPC process)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["curupira-sdk==0.2.0"]

[project.urls]
Homepage = "https://github.com/caipora-labs/curupira"
Repository = "https://github.com/caipora-labs/curupira"

[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[tool.uv.sources]
curupira-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/curupira_trello"]
