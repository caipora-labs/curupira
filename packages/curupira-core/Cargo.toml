[package]
name = "curupira"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Dispatch automations to local AI coding agents"
repository = "https://github.com/caipora-labs/curupira"
rust-version = "1.89"

[[bin]]
name = "curupira"
path = "src/bin/curupira.rs"

[[bin]]
name = "curu"
path = "src/bin/curu.rs"

[lib]
name = "curupira"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
cron = "0.17"
dirs = "6"
fs2 = "0.4"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
which = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
