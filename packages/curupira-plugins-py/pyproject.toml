[project]
name = "curupira-plugins"
dynamic = ["version"]
description = "Official Curupira trigger extensions (GitHub issues, pull requests, and Projects)"
requires-python = ">=3.11"
license = "MIT"
# Pre-releases need an explicit pre-release specifier, or pip ignores them.
dependencies = ["curupira-sdk[pydantic]>=0.1.0.dev0"]

[project.scripts]
curupira-plugins = "curupira_plugins.__main__:main"

[project.urls]
Homepage = "https://github.com/caipora-labs/curupira"
Repository = "https://github.com/caipora-labs/curupira"

[build-system]
requires = ["hatchling>=1.33.0,<2", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

# The version is the publish/curupira-plugins-py/<version> git tag (see curupira-sdk).
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", tag_regex = "^publish/curupira-plugins-py/(?P<version>.+)$", git_describe_command = "git describe --tags --long --match publish/curupira-plugins-py/*", fallback_version = "0.1.0.dev0" }

[tool.uv.sources]
curupira-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/curupira_plugins"]
