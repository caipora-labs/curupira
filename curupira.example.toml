[automations.resolve-ready-issues]
trigger_type = "github-issues"
repository = "api"
repo = "acme/api"
labels = ["agent-ready"]
exclude_labels = ["blocked"]
linked_pull_request = false
sort = "created-asc"
prompt = """
Resolve issue ${issue_number}: ${issue_title}

${issue_body}

Repository: ${repo}
Checkout: ${repository}
URL: ${issue_url}
"""

[automations.review-pull-requests]
trigger_type = "github-pull-requests"
repository = "api"
repo = "acme/api"
labels = ["review-needed"]
draft = false
mergeable = true
ci_status = "success"
profile = "claude-reviewer"
prompt = """
Review pull request ${pull_request_number}: ${pull_request_title}

${pull_request_body}

Repository: ${repo}
URL: ${pull_request_url}
Branch: ${pull_request_head_ref} -> ${pull_request_base_ref}
"""

[automations.review-azure-pull-requests]
trigger_type = "azure-cli-pull-requests"
repository = "azure-api"
repo = "contoso/api-project/api"
# status = "active"
# source_branch = "feature"
# target_branch = "main"
profile = "claude-reviewer"
prompt = """
Review pull request ${pull_request_number}: ${pull_request_title}

${pull_request_body}

Repository: ${repo}
URL: ${pull_request_url}
Branch: ${pull_request_head_ref} -> ${pull_request_base_ref}
"""

[automations.weekly-maintenance]
trigger_type = "cron"
repository = "api"
schedule = "0 9 * * 1"
# timezone = "Europe/Rome" # overrides agents.defaults.timezone
# start_date = 2026-10-05T00:00:00+02:00
# end_date = 2026-12-31T23:59:00+01:00
prompt = "Perform weekly maintenance for ${repository} (occurrence ${task_number})."
