# Only the CLIs used by your profiles need to be installed and authenticated.
[settings]
max_active_tasks = 1
max_pending_tasks = 100
workspace_dir = "~/.curupira/workspaces"
state_db_path = "~/.curupira/state.sqlite3"
# Endpoint opcional de traces OTLP/HTTP; omita para desativar a telemetria.
# otlp_endpoint = "http://localhost:4318/v1/traces"
task_timeout_minutes = 20 # coding-agent and setup-script deadline
max_output_bytes = 1000000 # retained tail per stdout/stderr stream

[settings.polling]
poll_interval_seconds = 30
batch_size = 100
cron_poll_interval_seconds = 1

# Git checkouts are independent from forge discovery. Automations reference these aliases.
[repositories.api]
remote = "https://github.com/acme/api.git"
# path = "~/code/api" # optional existing checkout or alternative clone destination
# setup_script = "scripts/bootstrap.sh" # runs only after a fresh clone

[repositories.azure-api]
remote = "https://dev.azure.com/contoso/api-project/_git/api"

[agents.defaults]
profile = "opencode-default"
timezone = "UTC"

# Interactive configuration assistant (optional). Omit until you choose a provider.
# [assistant]
# agent = "cursor" # registered coding-agent provider name
# model = "auto" # omit for native auto when supported; otherwise the CLI default

[agents.profiles.opencode-default]
provider = "opencode"
# agent = "issue-resolver" # existing native OpenCode custom agent
# model = "provider/model"
# effort = "high"
# auto_approve = true # explicit native permission override

[agents.profiles.claude-reviewer]
provider = "claude"
# agent = "pull-request-reviewer" # existing native Claude Code custom agent
# model = "sonnet"
# effort = "high"
# permission_mode = "dontAsk"
# permission_prompts = "none"

[agents.profiles.codex]
provider = "codex"
# model = "gpt-5.4"
# agent = "work" # existing Codex CLI configuration profile (--profile)
# effort = "high"
# sandbox = "workspace-write"
# auto_review = true
# Native custom-agent selection is not supported by a verified flag.

[agents.profiles.cursor]
provider = "cursor"
# agent = "ask" # native mode: agent, ask, or plan
# model = "composer-2.5"
# trust = true
# force = true
# Standalone effort is not supported by this adapter.

