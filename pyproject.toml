[project]
name = "curupira"
version = "0.2.0"
description = "Dispatch GitHub and cron tasks to local AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mario Taddeucci" }]
keywords = ["github", "automation", "coding-agents", "cli", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
# The CLI is the Rust binary. Official process extensions use the stdlib only.
dependencies = []

[project.urls]
Homepage = "https://github.com/caipora-labs/curupira"
Repository = "https://github.com/caipora-labs/curupira"
Issues = "https://github.com/caipora-labs/curupira/issues"
Changelog = "https://github.com/caipora-labs/curupira/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "maturin>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.16.10,<0.17",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
  "prek>=0.5.5,<0.6",
]
docs = [
  "mkdocs-macros-plugin>=1.3,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocs-static-i18n>=1.3,<2",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/curupira/Cargo.toml"
bindings = "bin"
python-source = "python"
include = [
  "plugins/**/*",
  "protocol/**/*",
  "python/curupira_official/**/*",
]

[tool.pytest.ini_options]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
