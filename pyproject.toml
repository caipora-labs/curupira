[project]
name = "opscli"
dynamic = ["version"]
description = "Dispatch GitHub and cron tasks to local AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mario Taddeucci" }]
keywords = ["github", "automation", "coding-agents", "cli", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "croniter>=6,<7",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "pyresilience>=0.4,<0.5",
  "typing-extensions>=4.12,<5",
  "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/mariotaddeucci/gh-dispatch"
Repository = "https://github.com/mariotaddeucci/gh-dispatch"
Issues = "https://github.com/mariotaddeucci/gh-dispatch/issues"
Changelog = "https://github.com/mariotaddeucci/gh-dispatch/blob/main/CHANGELOG.md"

[project.scripts]
opscli = "opscli.cli:main"

[dependency-groups]
dev = [
  "pyrefly>=1.3.2,<1.4",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.16.10,<0.17",
  "types-croniter>=6,<7",
  "pre-commit>=4,<5",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opscli"]

[tool.hatch.version]
path = "src/opscli/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md", "opscli.example.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
required-version = ">=0.16.10,<0.17"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN", "ASYNC", "DTZ", "S", "LOG", "G", "PTH", "C4", "SIM", "RET", "RUF", "PT", "C90", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ASYNC240", "ANN401"]
# Native executable discovery is intentional; arguments never pass through a shell.
"src/opscli/clients/process.py" = ["S603", "S607"]
# SQL identifiers are private constants; all externally supplied values are bound parameters.
"src/opscli/storage/*.py" = ["S608"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]
python-version = "3.11"
python-platform = ["linux", "darwin", "win32"]
required-version = ">=1.3.2,<1.4"
preset = "strict"
min-severity = "warn"

[tool.coverage.run]
branch = true
source = ["opscli"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]
