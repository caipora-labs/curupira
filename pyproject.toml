[project]
name = "curupira"
dynamic = ["version"]
description = "Dispatch GitHub and cron tasks to local AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mario Taddeucci" }]
keywords = ["github", "automation", "coding-agents", "cli", "cron"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "croniter>=6,<7",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "psutil>=6,<8",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "pyresilience>=0.4,<0.5",
  "textual>=2,<4",
  "typer>=0.16,<1",
  "typing-extensions>=4.12,<5",
  "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/caipora-labs/curupira"
Repository = "https://github.com/caipora-labs/curupira"
Issues = "https://github.com/caipora-labs/curupira/issues"
Changelog = "https://github.com/caipora-labs/curupira/blob/main/CHANGELOG.md"

[project.scripts]
curupira = "curupira.cli:main"
curu = "curupira.cli:main"

[dependency-groups]
dev = [
  "pyrefly>=1.3.2,<1.4",
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.16.10,<0.17",
  "types-croniter>=6,<7",
  "pre-commit>=4,<5",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
  "types-psutil>=6,<8",
]
docs = [
  "mkdocs-macros-plugin>=1.3,<2",
  "griffe-pydantic>=1,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.29,<1",
  "mkdocstrings-python>=1,<2",
  "mkdocs-static-i18n>=1.3,<2",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curupira"]

[tool.hatch.version]
path = "src/curupira/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "scripts",
  "pyproject.toml",
  "uv.lock",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "AGENTS.md",
  "SECURITY.md",
  "curupira.example.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
required-version = ">=0.16.10,<0.17"

[tool.ruff.lint]
select = [
  "A",     # builtin shadowing
  "ANN",   # annotations
  "ARG",   # unused arguments
  "ASYNC", # asyncio pitfalls
  "B",     # bugbear
  "BLE",   # blind except
  "C4",    # comprehensions
  "C90",   # mccabe complexity
  "D",     # docstrings (Google convention)
  "DTZ",   # timezone-aware datetimes
  "E",     # pycodestyle errors
  "ERA",   # commented-out code
  "F",     # pyflakes
  "FBT",   # boolean positional flags
  "FURB",  # modern idioms
  "G",     # logging format
  "I",     # import order
  "ISC",   # implicit string concatenation
  "LOG",   # logging
  "N",     # naming
  "PERF",  # performance anti-patterns
  "PIE",   # unnecessary code
  "PL",    # pylint
  "PT",    # pytest style
  "PTH",   # pathlib
  "RET",   # returns
  "RUF",   # ruff-specific
  "S",     # bandit security
  "SIM",   # simplify
  "T20",   # stray print
  "TRY",   # exception handling
  "UP",    # pyupgrade
]
ignore = [
  "D105",    # magic methods document themselves through their protocol
  "D107",    # __init__ parameters are documented on the class
  "TRY003",  # concise inline exception messages are clearer than one subclass per message
  "PLR2004", # named constants for every literal hurt readability more than they help
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
# Keyword-only dependency injection keeps constructors explicit; positional arguments stay at 5.
max-args = 8

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ASYNC240", "ANN401", "ARG", "FBT", "PLR0913", "PLC0415"]
# Executable discovery is intentional; arguments never pass through a shell.
"src/curupira/clients/process.py" = ["S603", "S607"]
# SQL identifiers are private constants; all externally supplied values are bound parameters.
"src/curupira/storage/*.py" = ["S608"]
# The CLI and release scripts report results on stdout by design.
"src/curupira/cli.py" = ["T201"]
"scripts/*.py" = ["T201"]

[tool.pyrefly]
project-includes = ["src", "tests", "scripts", "docs/macros.py"]
search-path = ["src", "."]
python-version = "3.11"
python-platform = ["linux", "darwin", "win32"]
required-version = ">=1.3.2,<1.4"
preset = "strict"
min-severity = "warn"

[tool.coverage.run]
branch = true
source = ["curupira"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "@abstractmethod"]
