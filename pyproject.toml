# Virtual uv workspace root: no distribution is built from here.
# Member packages live under packages/ (see AGENTS.md for the layout).
[tool.uv.workspace]
members = [
  "packages/curupira-python",
  "packages/curupira-python-sdk",
  "packages/plugins/curupira-azure",
  "packages/plugins/curupira-github",
  "packages/plugins/curupira-monday",
  "packages/plugins/curupira-trello",
]

[dependency-groups]
dev = [
  "maturin>=1.10,<2",
  "pytest>=8,<10",
  "ruff>=0.17.0,<0.18",
  "twine>=7,<8",
  "pip-audit>=2.9,<3",
  "prek>=0.5.5,<0.6",
]
docs = [
  "mkdocs-macros-plugin>=1.3,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocs-static-i18n>=1.3,<2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The Rust crate only holds Python protocol fixtures, which are not packages.
extend-exclude = ["packages/curupira-core"]
force-exclude = true

[tool.pytest.ini_options]
# Each package owns its tests; importlib mode lets same-named test files coexist.
testpaths = [
  "packages/curupira-python/tests",
  "packages/curupira-python-sdk/tests",
  "packages/plugins",
]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
