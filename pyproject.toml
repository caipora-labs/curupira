[project]
name = "gh-dispatch"
version = "0.1.0"
description = "Dispatch GitHub and cron tasks to local AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mario Taddeucci" }]
dependencies = ["croniter>=6,<7", "pydantic-settings>=2.7,<3", "pyresilience>=0.4,<0.5"]

[project.scripts]
gh-dispatch = "gh_dispatch.cli:main"

[dependency-groups]
dev = [
  "pyrefly>=0.17",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_dispatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyrefly]
project-includes = ["src", "tests"]
