# Managed with prek (https://prek.j178.dev/), a drop-in pre-commit alternative.
# Install hooks: uv run --no-sync prek install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path packages/curupira-core/Cargo.toml --all -- --check
        language: system
        files: '\.rs$'
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --manifest-path packages/curupira-core/Cargo.toml -- -D warnings
        language: system
        files: '\.rs$'
        pass_filenames: false
