  - Get started:
      - Installation: installation.md
      - Quick start: quick-start.md
      - How it works: concepts.md
  - Orchestrator:
      - Configuration: configuration.md
      - Automations: automations.md
      - Prompts:
          - Writing prompts: prompts.md
          - Field reference: prompt-fields.md
      - Running Curupira: operations.md
      - Terminal dashboard: tui.md
      - Coding agents:
          - Overview: providers.md
          - Claude Code: providers/claude.md
          - Codex: providers/codex.md
          - Cursor: providers/cursor.md
          - Gemini CLI: providers/gemini.md
          - GitHub Copilot CLI: providers/copilot.md
          - Kilo CLI: providers/kilo.md
          - OpenCode: providers/opencode.md
          - pi: providers/pi.md
          - Qwen Code: providers/qwen.md
  - Plugins:
      - Plugins and connectors: plugins.md
      - GitHub:
          - Issues and pull requests: github.md
          - Projects (board columns): github-projects.md
      - Recipes: recipes.md
  - Build extensions:
      - Overview: extensions.md
      - Python SDK: extensions-python.md
      - JavaScript and TypeScript SDK: extensions-javascript.md
      - Manifest and protocol: extensions-protocol.md
      - Contributing to Curupira: https://github.com/caipora-labs/curupira/blob/main/CONTRIBUTING.md
