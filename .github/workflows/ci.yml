name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the newest run per ref matters: a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      sdk: ${{ steps.filter.outputs.sdk }}
      js_sdk: ${{ steps.filter.outputs.js_sdk }}
      npm_cli: ${{ steps.filter.outputs.npm_cli }}
      plugins: ${{ steps.filter.outputs.plugins }}
      package: ${{ steps.filter.outputs.package }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            rust:
              - 'packages/curupira-cli/**'
              - 'packages/curupira-sdk-js/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
              - 'uv.lock'
            sdk:
              - 'packages/curupira-sdk-py/**'
              - '.github/workflows/ci.yml'
              - 'uv.lock'
              - 'pyproject.toml'
            js_sdk:
              - 'packages/curupira-sdk-js/**'
              - 'packages/curupira-cli/tests/js_sdk_npx.rs'
              - 'packages/curupira-cli/tests/fixtures/js-sdk-ext/**'
              - '.github/workflows/ci.yml'
            npm_cli:
              - 'packages/curupira-cli-js/**'
              - 'packages/curupira-cli/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish.yml'
              - '.github/scripts/**'
            plugins:
              - 'packages/curupira-plugins-py/**'
              - 'packages/curupira-sdk-py/**'
              - '.github/workflows/ci.yml'
              - 'uv.lock'
              - 'pyproject.toml'
            python:
              - 'packages/curupira-cli-py/**'
              - 'packages/curupira-sdk-py/**'
              - 'packages/curupira-plugins-py/**'
              - 'packages/curupira-cli/**'
              - '.github/workflows/ci.yml'
              - 'uv.lock'
              - 'pyproject.toml'
            docs:
              - 'docs/**'
              - '.github/scripts/check_docs_parity.py'
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
            package:
              - 'packages/**'
              - 'uv.lock'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'

  rust:
    name: Rust test and lint
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: cargo fmt --manifest-path packages/curupira-cli/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path packages/curupira-cli/Cargo.toml -- -D warnings
      - run: uv run --no-sync cargo test --manifest-path packages/curupira-cli/Cargo.toml
      - name: Validate example configuration
        run: |
          # example.toml uses uvx --from curupira-plugins for end users; rewrite to
          # the checkout path so CI does not need the package on PyPI yet.
          plugins_path="$(cd packages/curupira-plugins-py && pwd)"
          tmp_config="$(mktemp)"
          sed "s|--from\", \"curupira-plugins\"|--from\", \"${plugins_path}\"|" \
            packages/curupira-cli/curupira.example.toml > "$tmp_config"
          CURUPIRA_EXTENSIONS_PATH=packages/curupira-plugins-py \
            CURUPIRA_PYTHONPATH="$(ls -d packages/curupira-sdk-py/src packages/curupira-plugins-py/src | paste -sd: -)" \
            uv run --no-sync cargo run --manifest-path packages/curupira-cli/Cargo.toml --bin curupira -- \
            --config "$tmp_config" validate

  rust-windows:
    name: Rust tests on Windows
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      # Integration tests join PATH with ':' and assume a Unix Python. The .cmd shim
      # test lives in the library suite under cfg(windows).
      - run: cargo test --manifest-path packages/curupira-cli/Cargo.toml --lib

  js-sdk:
    name: JavaScript SDK tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.js_sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/curupira-sdk-js/package-lock.json
      - run: npm install
        working-directory: packages/curupira-sdk-js
      - run: npm test
        working-directory: packages/curupira-sdk-js
      - run: npm run typecheck
        working-directory: packages/curupira-sdk-js

  npm-cli:
    name: npm CLI tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.npm_cli == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm test
        working-directory: packages/curupira-cli-js

  python-sdk:
    name: Python SDK tests (Python ${{ matrix.python-version }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.sdk == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: uv run --no-sync ruff check packages/curupira-sdk-py
      - run: uv run --no-sync pytest packages/curupira-sdk-py/tests

  python-plugins:
    name: Python plugins tests (Python ${{ matrix.python-version }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.plugins == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: uv run --no-sync ruff check packages/curupira-plugins-py
      - run: uv run --no-sync pytest packages/curupira-plugins-py/tests

  python-packaging:
    name: Python packaging tests (Python ${{ matrix.python-version }})
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: uv run --no-sync ruff check packages
      - run: uv run --no-sync pytest

  docs-check:
    name: Documentation build and translations
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      # English, Portuguese and Spanish pages must stay equivalent (see CONTRIBUTING.md).
      - run: python3 .github/scripts/check_docs_parity.py docs
      - run: uv run --group docs mkdocs build --strict -f docs/mkdocs.yml

  package:
    name: Build distributions
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-cli
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Build distributions with uv
        run: uv build --all-packages --out-dir dist

  docs:
    name: Deploy documentation
    # Only main deploys, and only after every other job has passed.
    needs: [rust, rust-windows, js-sdk, npm-cli, python-sdk, python-plugins, python-packaging, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build documentation
        run: uv run --group docs mkdocs build --strict -f docs/mkdocs.yml
      - name: Upload built documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
