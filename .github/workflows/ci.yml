name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p curupira -p curupira-protocol -- -D warnings
      - run: cargo test -p curupira -p curupira-protocol
      - name: Validate example configuration
        run: |
          CURUPIRA_EXTENSIONS_PATH=plugins CURUPIRA_PYTHONPATH=python \
            cargo run -p curupira --bin curupira -- --config curupira.example.toml validate

  python:
    name: Python packaging tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync ruff check python tests plugins/sdk-python
      - run: PYTHONPATH=python uv run --no-sync pytest tests

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - name: Build wheel with maturin
        run: uv run --no-sync maturin build --release --out dist -m crates/curupira/Cargo.toml
      - name: Smoke-test the installed wheel outside the repository
        run: |
          uv run --no-sync python scripts/smoke_install.py \
            --dist dist \
            --config curupira.example.toml
