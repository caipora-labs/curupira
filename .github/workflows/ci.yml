name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: cargo fmt --manifest-path packages/curupira-core/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path packages/curupira-core/Cargo.toml -- -D warnings
      # Extensions are launched with `python3` from PATH, so run under the workspace environment
      # where curupira_sdk and the plugins' dependencies (pydantic) are installed.
      - run: uv run --no-sync cargo test --manifest-path packages/curupira-core/Cargo.toml
      - name: Validate example configuration
        run: |
          CURUPIRA_EXTENSIONS_PATH=packages/plugins \
            CURUPIRA_PYTHONPATH="$(ls -d packages/curupira-python-sdk/src packages/plugins/*/src | paste -sd: -)" \
            uv run --no-sync cargo run --manifest-path packages/curupira-core/Cargo.toml --bin curupira -- \
            --config packages/curupira-core/curupira.example.toml validate

  python:
    name: Python packaging tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - run: uv run --no-sync ruff check packages
      - run: uv run --no-sync pytest

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --all-packages --dev
      - name: Build distributions with uv
        run: uv build --all-packages --out-dir dist
      - name: Smoke-test the installed wheel outside the repository
        run: |
          uv run --no-sync python packages/curupira-python/scripts/smoke_install.py \
            --dist dist \
            --config packages/curupira-core/curupira.example.toml
