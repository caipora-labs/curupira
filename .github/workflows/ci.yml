name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  types:
    name: Strict type check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync pyrefly check

  test:
    name: Tests (${{ matrix.label }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            python-version: "3.11"
          - os: ubuntu-latest
            label: Linux x86_64
            python-version: "3.12"
          - os: ubuntu-latest
            label: Linux x86_64
            python-version: "3.13"
          - os: ubuntu-latest
            label: Linux x86_64
            python-version: "3.14"
          - os: ubuntu-24.04-arm
            label: Linux aarch64
            python-version: "3.13"
          - os: macos-latest
            label: macOS arm64
            python-version: "3.13"
          - os: macos-15-intel
            label: macOS x86_64
            python-version: "3.13"
          - os: windows-latest
            label: Windows amd64
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync pytest
      - run: uv run --no-sync curupira --config curupira.example.toml validate

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync pip-audit

  package:
    name: Build and install (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x86_64
            build_sdist: true
          - os: ubuntu-24.04-arm
            label: Linux aarch64
            build_sdist: false
          - os: macos-latest
            label: macOS arm64
            build_sdist: false
          - os: macos-15-intel
            label: macOS x86_64
            build_sdist: false
          - os: windows-latest
            label: Windows amd64
            build_sdist: false
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      # dtolnay/rust-toolchain (2026-10-01)
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build distributions
        shell: bash
        run: |
          if [ "${{ matrix.build_sdist }}" = "true" ]; then
            uv build
          else
            uv build --wheel
          fi
      - run: uv run --no-sync twine check dist/*
      - name: Smoke-test the installed wheel outside the repository
        shell: bash
        run: |
          uv run --no-sync python scripts/smoke_install.py \
            --dist dist \
            --config curupira.example.toml

  package-gate:
    name: Build and smoke-test distributions
    needs: package
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require package matrix success
        shell: bash
        run: |
          if [ "${{ needs.package.result }}" != "success" ]; then
            echo "Package matrix result: ${{ needs.package.result }}" >&2
            exit 1
          fi
