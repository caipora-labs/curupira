name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build distributions
    # Development tags stay off GitHub Releases. publish.yml uploads them to PyPI.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync pytest
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Attach GitHub release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
