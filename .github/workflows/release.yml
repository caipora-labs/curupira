name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    # Development tags stay off GitHub Releases. publish.yml uploads them to PyPI.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '.dev') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            build_sdist: true
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            build_sdist: false
          - os: macos-latest
            label: macos-arm64
            build_sdist: false
          - os: macos-15-intel
            label: macos-x86_64
            build_sdist: false
          - os: windows-latest
            label: windows-amd64
            build_sdist: false
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --frozen --dev
      - run: uv run --no-sync pytest
      # dtolnay/rust-toolchain (2026-10-01)
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build distributions
        shell: bash
        run: |
          if [ "${{ matrix.build_sdist }}" = "true" ]; then
            uv build
          else
            uv build --wheel
          fi
      - run: uv run --no-sync twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  release:
    name: Attach GitHub release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '.dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
