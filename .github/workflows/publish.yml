name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distributions
    # Stable vX.Y.Z and rehearsal vX.Y.Z.devN tags both publish to PyPI.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install-test:
    name: Install and validate
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Install wheel and run validate
        run: |
          uv sync --frozen --dev
          version="$(uv run --no-sync python scripts/verify_dist_version.py --dist dist)"
          uv run --no-sync python scripts/smoke_install.py \
            --dist dist \
            --config curupira.example.toml \
            --expected-version "${version}"

  publish:
    name: Publish distributions
    needs: install-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Verify distribution version and tag
        id: distribution_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --frozen --dev
          version="$(uv run --no-sync python scripts/verify_dist_version.py --dist dist --tag "$RELEASE_TAG")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -la dist/
      - name: Require successful CI validation on the published commit
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: uv run --no-sync python scripts/require_ci_checks.py
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2; it creates attestations before upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
