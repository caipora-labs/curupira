name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist/
      - name: Verify distribution version and tag
        id: distribution_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from email.parser import Parser
          from pathlib import Path

          versions = []
          for wheel in Path("dist").glob("*.whl"):
              with zipfile.ZipFile(wheel) as archive:
                  metadata_name = next(
                      name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
                  )
                  metadata = Parser().parsestr(archive.read(metadata_name).decode())
                  versions.append(metadata["Version"])
          for source in Path("dist").glob("*.tar.gz"):
              with tarfile.open(source, "r:gz") as archive:
                  metadata_file = next(
                      member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")
                  )
                  extracted = archive.extractfile(metadata_file)
                  if extracted is None:
                      raise SystemExit(f"Cannot read metadata from {source}")
                  metadata = Parser().parsestr(extracted.read().decode())
                  versions.append(metadata["Version"])

          if not versions or len(set(versions)) != 1:
              raise SystemExit(f"Distributions do not share one version: {versions}")
          version = versions[0]
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"Tag version {expected!r} does not match distributions: {versions}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Require successful CI validation on the published commit
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          release_sha = os.environ["RELEASE_SHA"]
          url = f"https://api.github.com/repos/{repository}/commits/{release_sha}/check-runs?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              checks = json.load(response)["check_runs"]

          required = {
              "Ruff lint and format",
              "Strict type check",
              "Tests (Linux, Python 3.11)",
              "Tests (Linux, Python 3.12)",
              "Tests (Linux, Python 3.13)",
              "Tests (Linux, Python 3.14)",
              "Build and smoke-test distributions",
          }
          latest = {}
          for check in checks:
              name = check["name"]
              if name in required and (
                  name not in latest or check["started_at"] > latest[name]["started_at"]
              ):
                  latest[name] = check

          missing = sorted(required - latest.keys())
          failed = sorted(
              name
              for name in required & latest.keys()
              if latest[name]["status"] != "completed" or latest[name]["conclusion"] != "success"
          )
          if missing or failed:
              raise SystemExit(f"CI validation is incomplete or unsuccessful; missing={missing}, failed={failed}")
          PY
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2; it creates attestations before upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
