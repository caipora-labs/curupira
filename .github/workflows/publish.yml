name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.label }})
    # Stable vX.Y.Z and rehearsal vX.Y.Z.devN tags both publish to PyPI.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            build_sdist: true
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            build_sdist: false
          - os: macos-latest
            label: macos-arm64
            build_sdist: false
          - os: macos-15-intel
            label: macos-x86_64
            build_sdist: false
          - os: windows-latest
            label: windows-amd64
            build_sdist: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build distributions
        shell: bash
        run: |
          if [ "${{ matrix.build_sdist }}" = "true" ]; then
            uv build
          else
            uv build --wheel
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  install-test:
    name: Install and validate (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download platform distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ matrix.label }}
          path: dist/
      - name: Install wheel and run validate
        shell: bash
        run: |
          uv sync --frozen --dev
          version="$(uv run --no-sync python scripts/verify_dist_version.py --dist dist --allow-wheels-only)"
          uv run --no-sync python scripts/smoke_install.py \
            --dist dist \
            --config curupira.example.toml \
            --expected-version "${version}"

  publish:
    name: Publish distributions
    needs: install-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Verify distribution version and tag
        id: distribution_version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv sync --frozen --dev
          version="$(uv run --no-sync python scripts/verify_dist_version.py --dist dist --tag "$RELEASE_TAG")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -la dist/
      - name: Require successful CI validation on the published commit
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: uv run --no-sync python scripts/require_ci_checks.py
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2; it creates attestations before upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
