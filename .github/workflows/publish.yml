name: Publish

# One pipeline for every workspace package. A tag names the package and the version to
# release: publish/<project>/<version>, for example publish/curupira-sdk/0.1.0dev0.
#
# workflow_dispatch rehearses a tag from any branch: it builds and verifies everything
# but never publishes or creates a release.
on:
  push:
    tags:
      - "publish/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish tag to rehearse, e.g. publish/curupira/0.3.0dev0 (nothing is uploaded)"
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      project: ${{ steps.tag.outputs.project }}
      version: ${{ steps.tag.outputs.version }}
      cargo_version: ${{ steps.tag.outputs.cargo_version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Parse publish tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: uv run --no-project --with packaging python packages/curupira-python/scripts/publish_tag.py "$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build source and pure distributions
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # hatch-vcs reads the publish tag from history, so the clone needs all of it.
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Stamp the release version into the Rust crate, npm manifest, and plugin manifest
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run --no-project --with packaging python packages/curupira-python/scripts/stamp_release_version.py --project "$PROJECT" --version "$VERSION"
      - name: Build source distributions and the pure-Python wheels
        # The curupira wheel is platform-specific and comes from build-curupira.
        run: |
          uv build --sdist --all-packages --out-dir dist
          uv build --wheel --package curupira-sdk --out-dir dist
          uv build --wheel --package curupira-plugins --out-dir dist
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-python
          path: dist/
          if-no-files-found: error

  build-curupira:
    name: Build curupira wheel (${{ matrix.name }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
            npm_target: linux-x64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            npm_target: linux-arm64
          - name: musllinux-x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            npm_target: linux-x64-musl
          - name: musllinux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            manylinux: musllinux_1_2
            npm_target: linux-arm64-musl
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64
            npm_target: darwin-x64
          - name: macos-arm64
            os: macos-latest
            target: aarch64
            npm_target: darwin-arm64
          - name: windows-x86_64
            os: windows-latest
            target: x64
            npm_target: win32-x64
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64
            npm_target: win32-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Stamp the release version into the Rust crate and npm manifest
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        shell: bash
        run: uv run --no-project --with packaging python packages/curupira-python/scripts/stamp_release_version.py --project "$PROJECT" --version "$VERSION"
      - name: Cache the Rust build (native targets only)
        if: ${{ !matrix.manylinux }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/curupira-core
          key: ${{ matrix.name }}
      - name: Build the curupira wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # maturin reads [tool.maturin] from the pyproject in this directory.
          working-directory: packages/curupira-python
          args: --release --out dist
      - name: Upload the curupira wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-curupira-${{ matrix.name }}
          path: packages/curupira-python/dist/
          if-no-files-found: error
      - name: Set up Node.js
        if: needs.resolve.outputs.project == 'curupira'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Assemble the npm platform package
        if: needs.resolve.outputs.project == 'curupira'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
          NPM_TARGET: ${{ matrix.npm_target }}
        run: |
          wheel="$(find packages/curupira-python/dist -name '*.whl' | head -n 1)"
          test -n "$wheel"
          node packages/curupira-npm/scripts/assemble.js wheel \
            --wheel "$wheel" \
            --target "$NPM_TARGET" \
            --version "$VERSION" \
            --out npm-stage
          node packages/curupira-npm/scripts/assemble.js verify-one \
            --dir npm-stage \
            --target "$NPM_TARGET" \
            --version "$VERSION"
      - name: Smoke-test the native binary
        if: needs.resolve.outputs.project == 'curupira' && matrix.manylinux != 'musllinux_1_2'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
          NPM_TARGET: ${{ matrix.npm_target }}
        run: |
          bin="npm-stage/curupira-${NPM_TARGET}/bin/curupira"
          if [[ "$NPM_TARGET" == win32-* ]]; then
            bin="${bin}.exe"
          fi
          out="$("$bin" --version | tr -d '\r')"
          test "$out" = "curupira ${VERSION}"
          "$bin" --help >/dev/null
      - name: Smoke-test the musl binary
        if: needs.resolve.outputs.project == 'curupira' && matrix.manylinux == 'musllinux_1_2'
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
          NPM_TARGET: ${{ matrix.npm_target }}
        run: |
          bin="npm-stage/curupira-${NPM_TARGET}/bin/curupira"
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22 "/work/${bin}" --version | tee musl-version.txt
          test "$(tr -d '\r' < musl-version.txt)" = "curupira ${VERSION}"
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22 "/work/${bin}" --help >/dev/null
      - name: Upload the npm platform package
        if: needs.resolve.outputs.project == 'curupira'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-curupira-${{ matrix.name }}
          path: npm-stage/
          if-no-files-found: error

  verify:
    name: Verify distribution versions
    needs: [resolve, build, build-curupira]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Check the built distributions carry the tag's version
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          uv run --no-project --with packaging python packages/curupira-python/scripts/verify_dist_version.py \
            --dist dist --project "$PROJECT" --version "$VERSION"

  publish:
    name: Publish distributions
    if: github.event_name == 'push'
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Require green CI
        run: python3 .github/scripts/require_ci_checks.py --repository "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}"
      - name: Select the tagged project's distributions
        env:
          PROJECT: ${{ needs.resolve.outputs.project }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          uv run --no-project --with packaging python packages/curupira-python/scripts/verify_dist_version.py \
            --dist dist --project "$PROJECT" --version "$VERSION" --copy-to publish-dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/

  pack-npm:
    name: Pack npm CLI packages
    needs: [resolve, build-curupira]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: needs.resolve.outputs.project == 'curupira'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Skip npm packing for other projects
        if: needs.resolve.outputs.project != 'curupira'
        run: echo "project ${{ needs.resolve.outputs.project }} does not publish the npm CLI"
      - name: Download platform packages
        if: needs.resolve.outputs.project == 'curupira'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: npm-curupira-*
          path: npm-stage
          merge-multiple: true
      - name: Stage the main package and check versions
        if: needs.resolve.outputs.project == 'curupira'
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
        run: |
          node packages/curupira-npm/scripts/assemble.js main \
            --version "$VERSION" \
            --out npm-stage
          node packages/curupira-npm/scripts/assemble.js verify \
            --dir npm-stage \
            --version "$VERSION"
      - name: Pack tarballs
        if: needs.resolve.outputs.project == 'curupira'
        run: |
          mkdir -p dist-npm/platform
          for dir in npm-stage/curupira-*; do
            npm pack --pack-destination dist-npm/platform "$dir"
          done
          npm pack --pack-destination dist-npm npm-stage/curupira
      - name: Install the Linux x64 package and run the CLI
        if: needs.resolve.outputs.project == 'curupira'
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
        run: |
          node packages/curupira-npm/scripts/install-local.js \
            --prefix "${RUNNER_TEMP}/curupira-npm" \
            --main dist-npm/caipora-curupira-${VERSION}.tgz \
            --platform dist-npm/platform/caipora-curupira-linux-x64-${VERSION}.tgz
          bin="${RUNNER_TEMP}/curupira-npm/node_modules/.bin/curupira"
          test "$("$bin" --version)" = "curupira ${VERSION}"
          "$bin" --help >/dev/null
          test "$("${RUNNER_TEMP}/curupira-npm/node_modules/.bin/curu" --version)" = "curu ${VERSION}"
      - name: Upload npm tarballs
        if: needs.resolve.outputs.project == 'curupira'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-npm
          path: dist-npm/
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    # Trusted publishing: register each @caipora/curupira* package for this workflow
    # and the npm environment before the first publish/curupira tag. Nothing is
    # uploaded from workflow_dispatch.
    if: github.event_name == 'push' && needs.resolve.outputs.project == 'curupira'
    needs: [resolve, pack-npm]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Download npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-npm
          path: dist-npm
      - name: Require the release version on every tarball
        env:
          VERSION: ${{ needs.resolve.outputs.cargo_version }}
        run: |
          node packages/curupira-npm/scripts/assemble.js verify-tarballs \
            --dir dist-npm \
            --version "$VERSION"
      - name: Install npm with trusted publishing
        run: npm install -g npm@11
      - name: Publish platform packages, then the CLI
        run: |
          shopt -s nullglob
          for tarball in dist-npm/platform/*.tgz; do
            npm publish "$tarball" --access public --provenance
          done
          npm publish dist-npm/caipora-curupira-*.tgz --access public --provenance

  release:
    name: Attach GitHub release
    # Pre-releases (dev, alpha, beta, rc) stay off GitHub Releases; PyPI still gets them.
    # publish-npm is skipped for other projects; a failed npm publish blocks the release.
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.resolve.outputs.prerelease == 'false' &&
      needs.resolve.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.pack-npm.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped')
    needs: [resolve, publish, pack-npm, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROJECT: ${{ needs.resolve.outputs.project }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Download npm tarballs
        if: env.PROJECT == 'curupira'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-npm
          path: dist-npm
      - name: Attach the tagged project's distributions
        run: |
          uv run --no-project --with packaging python packages/curupira-python/scripts/verify_dist_version.py \
            --dist dist --project "$PROJECT" --version "$VERSION" --copy-to release-dist
          files=(release-dist/*)
          if [ "$PROJECT" = "curupira" ]; then
            files+=(dist-npm/*.tgz dist-npm/platform/*.tgz)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$PROJECT $VERSION" --generate-notes
