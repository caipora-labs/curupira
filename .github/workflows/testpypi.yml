name: TestPyPI rehearsal

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.dev*"

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.label }})
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            build_sdist: true
          - os: ubuntu-24.04-arm
            label: linux-aarch64
            build_sdist: false
          - os: macos-latest
            label: macos-arm64
            build_sdist: false
          - os: macos-15-intel
            label: macos-x86_64
            build_sdist: false
          - os: windows-latest
            label: windows-amd64
            build_sdist: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build distributions
        shell: bash
        run: |
          rm -rf dist
          if [ "${{ matrix.build_sdist }}" = "true" ]; then
            uv build
          else
            uv build --wheel
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          if-no-files-found: error

  install-test:
    name: Install and validate (${{ matrix.label }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x86_64
          - os: windows-latest
            label: windows-amd64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Download platform distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist-${{ matrix.label }}
          path: dist/
      - name: Install wheel and run validate
        shell: bash
        run: |
          uv sync --frozen --dev
          version="$(uv run --no-sync python scripts/verify_dist_version.py --dist dist --allow-wheels-only)"
          uv run --no-sync python scripts/smoke_install.py \
            --dist dist \
            --config curupira.example.toml \
            --expected-version "${version}"

  publish:
    name: Publish and smoke-test TestPyPI
    needs: install-test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Verify CI validation checks passed for this commit
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          uv sync --frozen --dev
          uv run --no-sync python scripts/require_ci_checks.py
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: Verify distribution version and tag
        id: package_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--dist dist)
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--tag "$REF_NAME" --require-dev)
          fi
          version="$(uv run --no-sync python scripts/verify_dist_version.py "${args[@]}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -la dist/
      - name: Publish rehearsal to TestPyPI
        # pypa/gh-action-pypi-publish v1.14.2; it creates attestations before upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Smoke-test the TestPyPI installation
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          python -m venv /tmp/curupira-testpypi
          installed=0
          for _attempt in 1 2 3 4 5 6; do
            if /tmp/curupira-testpypi/bin/pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "curupira==${PACKAGE_VERSION}"; then
              installed=1
              break
            fi
            sleep 15
          done
          if [ "$installed" -ne 1 ]; then
            echo "TestPyPI install of curupira==${PACKAGE_VERSION} failed" >&2
            exit 1
          fi
          cd /tmp
          /tmp/curupira-testpypi/bin/python - <<'PY'
          import os

          import curupira
          from curupira._native import rust_core_version
          from curupira.native import rust_core_version as wrapped

          expected = os.environ["PACKAGE_VERSION"]
          if curupira.__version__ != expected:
              raise SystemExit(f"installed version {curupira.__version__!r} != {expected!r}")
          version = rust_core_version()
          if not isinstance(version, str) or not version.strip():
              raise SystemExit(f"empty native version: {version!r}")
          if wrapped() != version:
              raise SystemExit("curupira.native.rust_core_version did not return the crate version")
          print(version)
          PY
          /tmp/curupira-testpypi/bin/curupira --help >/tmp/curupira-help.txt
          grep -q 'usage: curupira' /tmp/curupira-help.txt
          test "$(/tmp/curupira-testpypi/bin/curupira --version)" = "curupira ${PACKAGE_VERSION}"
          /tmp/curupira-testpypi/bin/curu --help >/tmp/curu-help.txt
          grep -q 'usage: curu' /tmp/curu-help.txt
          test "$(/tmp/curupira-testpypi/bin/curu --version)" = "curu ${PACKAGE_VERSION}"
          /tmp/curupira-testpypi/bin/curupira --config "$GITHUB_WORKSPACE/curupira.example.toml" validate
