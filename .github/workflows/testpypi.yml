name: TestPyPI rehearsal

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.dev*"

permissions: {}

jobs:
  rehearse:
    name: Build, publish, and install from TestPyPI
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Verify CI validation checks passed for this commit
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ["GH_REPOSITORY"]
          release_sha = os.environ["RELEASE_SHA"]
          url = f"https://api.github.com/repos/{repository}/commits/{release_sha}/check-runs?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              checks = json.load(response)["check_runs"]

          required = {
              "Ruff lint and format",
              "Strict type check",
              "Tests (Linux, Python 3.11)",
              "Tests (Linux, Python 3.12)",
              "Tests (Linux, Python 3.13)",
              "Tests (Linux, Python 3.14)",
              "Build and smoke-test distributions",
          }
          latest = {}
          for check in checks:
              name = check["name"]
              if name in required and (
                  name not in latest or check["started_at"] > latest[name]["started_at"]
              ):
                  latest[name] = check

          missing = sorted(required - latest.keys())
          failed = sorted(
              name
              for name in required & latest.keys()
              if latest[name]["status"] != "completed" or latest[name]["conclusion"] != "success"
          )
          if missing or failed:
              raise SystemExit(f"CI validation is incomplete or unsuccessful; missing={missing}, failed={failed}")
          PY
      - name: Build distributions
        run: |
          rm -rf dist
          uv build
      - name: Verify distribution version and tag
        id: package_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--dist dist)
          if [ "$EVENT_NAME" = "push" ]; then
            args+=(--tag "$REF_NAME" --require-dev)
          fi
          version="$(python scripts/verify_dist_version.py "${args[@]}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish rehearsal to TestPyPI
        # pypa/gh-action-pypi-publish v1.14.2; it creates attestations before upload.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Smoke-test the TestPyPI installation
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          python -m venv /tmp/curupira-testpypi
          installed=0
          for _attempt in 1 2 3 4 5 6; do
            if /tmp/curupira-testpypi/bin/pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "curupira==${PACKAGE_VERSION}"; then
              installed=1
              break
            fi
            sleep 15
          done
          if [ "$installed" -ne 1 ]; then
            echo "TestPyPI install of curupira==${PACKAGE_VERSION} failed" >&2
            exit 1
          fi
          cd /tmp
          /tmp/curupira-testpypi/bin/python - <<'PY'
          import os

          import curupira
          from curupira._native import rust_core_version
          from curupira.native import rust_core_version as wrapped

          expected = os.environ["PACKAGE_VERSION"]
          if curupira.__version__ != expected:
              raise SystemExit(f"installed version {curupira.__version__!r} != {expected!r}")
          version = rust_core_version()
          if not isinstance(version, str) or not version.strip():
              raise SystemExit(f"empty native version: {version!r}")
          if wrapped() != version:
              raise SystemExit("curupira.native.rust_core_version did not return the crate version")
          print(version)
          PY
          /tmp/curupira-testpypi/bin/curupira --help >/tmp/curupira-help.txt
          grep -q 'usage: curupira' /tmp/curupira-help.txt
          test "$(/tmp/curupira-testpypi/bin/curupira --version)" = "curupira ${PACKAGE_VERSION}"
          /tmp/curupira-testpypi/bin/curu --help >/tmp/curu-help.txt
          grep -q 'usage: curu' /tmp/curu-help.txt
          test "$(/tmp/curupira-testpypi/bin/curu --version)" = "curu ${PACKAGE_VERSION}"
